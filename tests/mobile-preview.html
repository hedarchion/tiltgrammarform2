<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palm2Grammar · responsive layout checks</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e5e9e7;color:#18333d;font:14px system-ui}header{display:flex;align-items:center;gap:10px;padding:12px 16px;flex-wrap:wrap}label{font-size:12px;font-weight:700}select,button{font:inherit;padding:7px;border:1px solid #a5b3ac;border-radius:6px;background:white}#stage{margin:4px auto;overflow:hidden;border-radius:16px;box-shadow:0 0 0 1px #a5b3ac}iframe{display:block;border:0;transform-origin:top left;background:#0c1e27}p{font-size:11px;text-align:center;margin:8px}
</style>
<header><label>Viewport <select id="viewport"><option value="390,844">Phone · 390 × 844</option><option value="320,568">Small phone · 320 × 568</option><option value="768,1024">Tablet · 768 × 1024</option><option value="1024,768">Tablet landscape · 1024 × 768</option><option value="844,390">Phone landscape · 844 × 390</option><option value="1280,600">Short desktop · 1280 × 600</option><option value="1280,720">Laptop · 1280 × 720</option><option value="1366,768">Laptop · 1366 × 768</option><option value="1920,1080">Desktop · 1920 × 1080</option><option value="1440,900">Classroom · 1440 × 900</option></select></label><label>Screen <select id="scenario"><option value="home">Home</option><option value="classhome">Class home</option><option value="play">Question</option><option value="long">Long question</option><option value="camera">Camera layout</option><option value="result">Result</option><option value="navigation">Palm navigation</option><option value="settings">Settings</option><option value="class">Class entry</option><option value="ranks">Ranks</option></select></label><label>UI <select id="appearance"><option value="auto">Mode default</option><option value="glass">Glass</option><option value="lite">Lite</option></select></label><button id="apply">Show</button></header>
<div id="stage"><iframe id="game" src="../" title="Palm2Grammar layout fixture"></iframe></div><p>Layout fixture · camera view is simulated; no camera access requested</p>
<pre id="metrics" hidden></pre>
<script>
const frame=document.getElementById('game'),stage=document.getElementById('stage');
function measure(){const d=frame.contentDocument;if(!d?.getElementById('app'))return;const ids=['lobby','lobbyClassName','lobbyRoster','manageBtn','lobbyForm','lobbyDifficulty','sentenceCard','optionLeft','optionRight','feedbackLine','cameraToggleBtn','teacherBtn','stopGameBtn','streakRack','startBtn','roundOverlay','roundPortrait','roundStopBtn','roundMarks','nextPlayerBtn','replayPlayerBtn','teacherPanel'];const metrics={viewport:[d.documentElement.clientWidth,d.documentElement.clientHeight],scrollWidth:d.documentElement.scrollWidth,scrollHeight:d.documentElement.scrollHeight,scenario:document.getElementById('scenario').value,homeLayout:Object.fromEntries(['.logo','.game-modes','.appearance-picker','.lobby-grid','.lobby-main','.lobby-side','.developer-credit'].map(selector=>{const e=d.querySelector(selector),r=e.getBoundingClientRect();return [selector,{x:r.x,y:r.y,w:r.width,h:r.height,bottom:r.bottom,scrollWidth:e.scrollWidth,clientWidth:e.clientWidth}]})),appearance:frame.contentWindow.selectedAppearance(),styles:Object.fromEntries(["glassThemeStyles","liteThemeStyles"].map(id=>{const e=d.getElementById(id);return [id,{disabled:e.disabled,media:e.media,sheet:e.sheet?.disabled}]})),rendererActive:frame.contentWindow.GlassRenderer?.active()||false,rects:Object.fromEntries(ids.map(id=>{const e=d.getElementById(id),r=e.getBoundingClientRect(),style=frame.contentWindow.getComputedStyle(e);return [id,{x:r.x,y:r.y,w:r.width,h:r.height,bottom:r.bottom,scroll:e.scrollHeight,client:e.clientHeight,scrollWidth:e.scrollWidth,clientWidth:e.clientWidth,display:style.display,color:style.color,background:style.backgroundColor,border:style.borderStyle,shadow:style.boxShadow}]})),trackingResources:frame.contentWindow.performance.getEntriesByType('resource').filter(r=>/vendor|models/.test(r.name)).map(r=>r.name),refractionCanvases:d.querySelectorAll('.glass-surface,.glass-scene').length};document.getElementById('metrics').textContent=JSON.stringify(metrics);}
function size(){const [width,height]=document.getElementById('viewport').value.split(',').map(Number);const scale=Math.min((innerWidth-32)/width,(innerHeight-116)/height,1);frame.style.width=width+'px';frame.style.height=height+'px';frame.style.transform=`scale(${scale})`;stage.style.width=width*scale+'px';stage.style.height=height*scale+'px';measure();}
function simulateNavigation(){if(!['navigation','class','ranks'].includes(document.getElementById('scenario').value))return;const d=frame.contentDocument;d.body.classList.remove('camera-off');d.body.classList.add('camera-on','palm-navigation');d.getElementById('lbAutoHint').classList.add('hidden');}
function show(){size();const w=frame.contentWindow,d=frame.contentDocument,scenario=document.getElementById('scenario').value;w.stopCamera();w.clearGameTimers();w.abortSession();w.closeTeacherPanel();d.getElementById('toast').className='toast';w.changePlayMode(['classhome','class','ranks','navigation'].includes(scenario)?'class':'single');const appearance=document.getElementById('appearance').value;w.applyAppearance(appearance==='auto'?(w.mobileDevice()||!(['classhome','class','ranks','navigation'].includes(scenario))?'lite':'glass'):appearance);if(['classhome','class','ranks','navigation'].includes(scenario)){if(!w.getCurrentClass())w.createClass('2 Bestari');}if(scenario==='home'||scenario==='classhome'){size();return;}if(scenario==='settings'){w.openTeacher();size();return;}if(scenario==='ranks'){const players=w.currentStudents();if(!players.length)for(let i=0;i<4;i++)players.push(w.normalizeStudent({numbered:true,totalScore:900-i*170,games:2,bestStreak:8-i}));w.showLeaderboard({after:'lobby'});simulateNavigation();size();return;}if(scenario==='navigation'&&!w.currentStudents().length){w.currentStudents().push(w.normalizeStudent({numbered:true}));w.saveDB();}w.startSession();w.clearGameTimers();if(scenario==='class'){simulateNavigation();size();return;}w.startRound(w.currentStudents()[0]);if(scenario==='long'){const q=w.BANK.reduce((a,b)=>a.s.length>b.s.length?a:b);d.getElementById('sentence').innerHTML=w.sentenceMarkup(q);d.getElementById('questionTopic').textContent=q.topic.toUpperCase();d.getElementById('optionLeftText').textContent=q.c;d.getElementById('optionRightText').textContent=q.f;}if(scenario==='camera'){d.body.classList.remove('camera-off');d.body.classList.add('camera-on');d.getElementById('palmStatus').textContent='Raise your left or right open palm · instant answer';}if(scenario==='result'||scenario==='navigation'){for(let i=0;i<8;i++){w.answer(w.correctIndex(w.currentQuestion())===0?'left':'right');w.advanceRound();}w.clearGameTimers();}simulateNavigation();d.getElementById('toast').className='toast';size();}
frame.addEventListener('load',()=>{frame.contentWindow.matchMedia('(max-width: 1100px), (pointer: coarse)').addEventListener('change',simulateNavigation);show();});document.getElementById('apply').addEventListener('click',show);document.getElementById('viewport').addEventListener('change',show);document.getElementById('scenario').addEventListener('change',show);document.getElementById('appearance').addEventListener('change',show);addEventListener('resize',size);size();
</script></html>
